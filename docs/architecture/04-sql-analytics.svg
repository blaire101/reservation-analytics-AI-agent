<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1850" viewBox="0 0 1200 1850">
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.12"/></filter><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52647a"/></marker></defs>
<rect width="1200" height="1850" fill="#f7f9fc"/>
<text x="600" y="65" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#17243a">Part 3 — Controlled SQL Analytics</text>
<text x="600" y="105" text-anchor="middle" font-family="Arial" font-size="20" fill="#637083">Resolve context first, then query metrics or details</text>
<rect x="270" y="145" width="660" height="105" rx="22" fill="#eef6ff" stroke="#8bb7e8" stroke-width="2" filter="url(#shadow)"/><text x="600.0" y="183" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#1f2f46">Analytics Question</text><text x="600.0" y="211" text-anchor="middle" font-family="Arial" font-size="17" fill="#5f6d80">Natural-language data request</text><line x1="600" y1="250" x2="600" y2="295" stroke="#52647a" stroke-width="3" marker-end="url(#arrow)"/><rect x="270" y="295" width="660" height="105" rx="22" fill="#eef6ff" stroke="#8bb7e8" stroke-width="2" filter="url(#shadow)"/><text x="600.0" y="333" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#1f2f46">Structured Context</text><text x="600.0" y="361" text-anchor="middle" font-family="Arial" font-size="17" fill="#5f6d80">Country + Product + Campaign</text><line x1="600" y1="400" x2="600" y2="445" stroke="#52647a" stroke-width="3" marker-end="url(#arrow)"/><rect x="270" y="445" width="660" height="105" rx="22" fill="#fff8e8" stroke="#e7b95b" stroke-width="2" filter="url(#shadow)"/><text x="600.0" y="483" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#1f2f46">Validate Required Fields</text><text x="600.0" y="511" text-anchor="middle" font-family="Arial" font-size="17" fill="#5f6d80">Ask when context is missing</text><line x1="600" y1="550" x2="600" y2="595" stroke="#52647a" stroke-width="3" marker-end="url(#arrow)"/><rect x="270" y="595" width="660" height="105" rx="22" fill="#fff8e8" stroke="#e7b95b" stroke-width="2" filter="url(#shadow)"/><text x="600.0" y="633" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#1f2f46">Resolve Context</text><text x="600.0" y="661" text-anchor="middle" font-family="Arial" font-size="17" fill="#5f6d80">dim_campaign_df + dim_product_df + dim_site_df</text><line x1="600" y1="700" x2="600" y2="745" stroke="#52647a" stroke-width="3" marker-end="url(#arrow)"/><rect x="270" y="745" width="660" height="105" rx="22" fill="#fff8e8" stroke="#e7b95b" stroke-width="2" filter="url(#shadow)"/><text x="600.0" y="783" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#1f2f46">Resolution Result</text><text x="600.0" y="811" text-anchor="middle" font-family="Arial" font-size="17" fill="#5f6d80">0 = not found   |   1 = continue   |   many = clarify</text><line x1="600" y1="850" x2="600" y2="895" stroke="#52647a" stroke-width="3" marker-end="url(#arrow)"/><rect x="270" y="895" width="660" height="105" rx="22" fill="#ecfbf4" stroke="#72c39a" stroke-width="2" filter="url(#shadow)"/><text x="600.0" y="933" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#1f2f46">Select Controlled SQL</text><text x="600.0" y="961" text-anchor="middle" font-family="Arial" font-size="17" fill="#5f6d80">Aggregate metric or detail template</text><line x1="600" y1="1000" x2="600" y2="1045" stroke="#52647a" stroke-width="3" marker-end="url(#arrow)"/><rect x="270" y="1045" width="660" height="105" rx="22" fill="#edf7ff" stroke="#73aee6" stroke-width="2" filter="url(#shadow)"/><text x="600.0" y="1083" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#1f2f46">QueryBackend.execute(sql)</text><text x="600.0" y="1111" text-anchor="middle" font-family="Arial" font-size="17" fill="#5f6d80">Backend-independent execution</text><line x1="600" y1="1150" x2="600" y2="1195" stroke="#52647a" stroke-width="3" marker-end="url(#arrow)"/><rect x="270" y="1195" width="660" height="105" rx="22" fill="#eefaf1" stroke="#77b98b" stroke-width="2" filter="url(#shadow)"/><text x="600.0" y="1233" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#1f2f46">dm_reservation_subject_df</text><text x="600.0" y="1261" text-anchor="middle" font-family="Arial" font-size="17" fill="#5f6d80">Trusted Data Mart</text><line x1="600" y1="1300" x2="600" y2="1345" stroke="#52647a" stroke-width="3" marker-end="url(#arrow)"/><rect x="270" y="1345" width="660" height="105" rx="22" fill="#eefaf1" stroke="#77b98b" stroke-width="2" filter="url(#shadow)"/><text x="600.0" y="1383" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#1f2f46">Business Response</text><text x="600.0" y="1411" text-anchor="middle" font-family="Arial" font-size="17" fill="#5f6d80">Metrics or fuser_id_hash detail records</text><text x="600" y="1760" text-anchor="middle" font-family="Arial" font-size="20" fill="#475569">Raw fuser_id stays internal and is never exposed in agent responses.</text></svg>