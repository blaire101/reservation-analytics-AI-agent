<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#1f5ca8"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.12"/>
  </filter>
</defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="60" y="65" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0b1736">FAISS L2 Distance</text>
<text x="60" y="100" font-family="Arial, sans-serif" font-size="17" fill="#5f6d80">Vector search compares the query embedding with stored document embeddings and returns the nearest candidates.</text>
<g filter="url(#shadow)">
<rect x="70" y="205" width="250" height="110" rx="16" fill="#ffffff" stroke="#1f5ca8" stroke-width="2"/>
<text x="195.0" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1736">Query Vector</text>
<text x="195.0" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5f6d80">q = embedding(question)</text>
</g><g filter="url(#shadow)">
<rect x="425" y="205" width="250" height="110" rx="16" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
<text x="550.0" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1736">FAISS Index</text>
<text x="550.0" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5f6d80">stored chunk vectors</text>
</g><g filter="url(#shadow)">
<rect x="780" y="205" width="250" height="110" rx="16" fill="#ffffff" stroke="#16805b" stroke-width="2"/>
<text x="905.0" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1736">Nearest Neighbors</text>
<text x="905.0" y="273" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5f6d80">Top-K smallest distances</text>
</g><g filter="url(#shadow)">
<rect x="425" y="390" width="250" height="105" rx="16" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
<text x="550.0" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0b1736">L2 Distance</text>
<text x="550.0" y="458" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#5f6d80">Σ (qᵢ - xᵢ)²</text>
</g><line x1="320" y1="260" x2="425" y2="260" stroke="#1f5ca8" stroke-width="3" marker-end="url(#arrow)"/><line x1="675" y1="260" x2="780" y2="260" stroke="#1f5ca8" stroke-width="3" marker-end="url(#arrow)"/><line x1="550" y1="315" x2="550" y2="390" stroke="#1f5ca8" stroke-width="3" marker-end="url(#arrow)"/><text x="600.0" y="585" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#334155">Smaller L2 distance means the vectors are closer in embedding space.</text></svg>